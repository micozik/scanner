name: 个股打法回测

# 2026-11-18：抄底 vs 强者恒强 × 强市/弱市（momentum_backtest.py）
permissions:
  contents: write
concurrency:
  group: momentum-bt
  cancel-in-progress: false
on:
  workflow_dispatch:
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install akshare==1.20.39 pandas requests lxml
      - run: timeout 2100 python momentum_backtest.py || echo "失败"
      - name: 提交
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          cp reports/个股打法回测.txt /tmp/bt.txt
          for i in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            cp /tmp/bt.txt reports/个股打法回测.txt
            git add reports/个股打法回测.txt
            if [ -z "$(git diff --staged --name-only)" ]; then exit 0; fi
            git commit -m "个股打法回测 $(date -u '+%Y-%m-%d %H:%M') UTC"
            if git push origin HEAD:main; then exit 0; fi
            sleep 8
          done
