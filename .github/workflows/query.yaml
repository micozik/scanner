name: 查股票

# ══════════════════════════════════════════════════════════
#  独立的【点单查询】工作流，和主扫描完全分开
#
#  为什么要独立：
#    主扫描 scan.yml 基线已经 20分02秒，上限 22 分钟，
#    只剩 2 分钟余量。任何补丁塞进去都会撑爆（#518 就是 22m26s 被杀）。
#    ★这个工作流只跑查询，约 1 分钟，永远不会影响主扫描★
#
#  怎么用：
#    Actions → 左边点【查股票】→ Run workflow
#    在框里填，逗号分隔，股票和板块可以混填：
#        中航沈飞, 军工装备, 002297
#    跑完看 reports/查询结果_最新.txt
#
#  放置位置：.github/workflows/query.yml
# ══════════════════════════════════════════════════════════

permissions:
  contents: write

concurrency:
  group: scan-query        # 和主扫描的组分开，互不取消
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      q:
        description: '填股票名字/代码/板块名（逗号分隔）例：中航沈飞, 军工装备, 002297'
        required: true
        default: ''

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 8      # 实际约1分钟，8分钟是安全余量

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas requests lxml beautifulsoup4

      - name: 执行查询
        env:
          QUERY_MODE: '1'          # ★只有这里设了，patch_query 才会真正干活★
          QUERY_TEXT: ${{ github.event.inputs.q }}
        run: |
          # ★手机下载文件时 GitHub 会把下划线变成空格，两种名字都要认★
          if [ -f "patch_query.py" ]; then
            echo "找到 patch_query.py"
            python "patch_query.py"
          elif [ -f "patch query.py" ]; then
            echo "找到 patch query.py（带空格）"
            python "patch query.py"
          else
            echo "🔴 找不到查询程序，仓库根目录现有的 patch 文件："
            ls -1 patch*.py 2>/dev/null || echo "（一个都没有）"
            exit 1
          fi

      - name: 提交结果
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          if [ -z "$(git status --porcelain reports/)" ]; then
            echo "无变化"; exit 0
          fi
          for i in 1 2 3; do
            echo "── 推送尝试 $i/3 ──"
            git stash push -u reports/ || true
            git fetch origin main
            git reset --hard origin/main
            git stash pop || git checkout --theirs . || true
            git add -A reports/
            if [ -z "$(git diff --staged --name-only)" ]; then
              echo "对齐后无差异"; exit 0
            fi
            git commit -m "query $(date -u '+%Y-%m-%d %H:%M') UTC"
            if git push origin HEAD:main; then
              echo "✅ 推送成功"; exit 0
            fi
            echo "⚠️ 推送失败，8秒后重试"; sleep 8
          done
          echo "🔴 三次推送均失败"
          exit 0
