name: A股自动扫描

# ★★★V8.9 修复 8/12 事故：403 Permission denied★★★
# 症状：扫描跑成功(4m17s)，但最后一步"提交报告"失败 exit 128
#      remote: Permission to micozik/scanner.git denied to github-actions[bot]
# 根因：重写 workflow 时漏了 permissions 声明。
#      GitHub 默认给 GITHUB_TOKEN 只读权限，push 会被 403 拒绝。
# 修法：下面这三行。缺一不可。
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      full:
        description: '盘中也跑完整版？(填 1 = 完整版，留空 = 快扫)'
        required: false
        default: ''
  schedule:
    # ───────── 时间全部为 UTC，北京时间 = UTC + 8 ─────────
    # ⚡ 盘中快扫（自动进入 FAST 模式）
    - cron: '25 1 * * 1-5'    # 北京 09:25
    - cron: '25 2 * * 1-5'    # 北京 10:25
    - cron: '25 3 * * 1-5'    # 北京 11:25
    - cron: '0 5 * * 1-5'     # 北京 13:00
    - cron: '0 6 * * 1-5'     # 北京 14:00
    - cron: '55 6 * * 1-5'    # 北京 14:55 尾盘
    # 📊 盘后全扫（15点后自动跑完整版）
    - cron: '30 7 * * 1-5'    # 北京 15:30
    # 🗓 周末
    - cron: '15 1 * * 6,0'    # 北京 09:15
    - cron: '15 5 * * 6,0'    # 北京 13:15
    - cron: '15 9 * * 6,0'    # 北京 17:15
    - cron: '15 13 * * 6,0'   # 北京 21:15

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ★V8.9 提速：缓存 pip，安装依赖从 19秒 降到几秒
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas requests lxml beautifulsoup4

      - name: 运行扫描
        env:
          FULL: ${{ github.event.inputs.full }}
        run: python scanner_cloud.py

      - name: 提交报告
        run: |
          git config user.name  "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet && echo "无变化，跳过提交" && exit 0
          git commit -m "scan $(date -u '+%Y-%m-%d %H:%M') UTC"
          # 先拉再推，防止多个定时任务并发时冲突
          git pull --rebase --autostash || true
          git push
