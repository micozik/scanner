name: A股自动扫描

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      check:
        description: '★即时体检★ 填股票名字或代码（多只用逗号分隔，如：香农芯创,德明利）留空则不查'
        required: false
        default: ''
  schedule:
    - cron: '25 1 * * 1-5'    # 北京 09:25
    - cron: '25 2 * * 1-5'    # 北京 10:25
    - cron: '25 3 * * 1-5'    # 北京 11:25
    - cron: '0 5 * * 1-5'     # 北京 13:00
    - cron: '0 6 * * 1-5'     # 北京 14:00
    - cron: '55 6 * * 1-5'    # 北京 14:55
    - cron: '30 7 * * 1-5'    # 北京 15:30 盘后
    - cron: '15 1 * * 6,0'
    - cron: '15 5 * * 6,0'
    - cron: '15 9 * * 6,0'
    - cron: '15 13 * * 6,0'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas requests lxml beautifulsoup4
      - name: 运行扫描
        env:
          CHECK: ${{ github.event.inputs.check }}
        run: python scanner_cloud.py
      - name: 提交报告
        run: |
          git config user.name  "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet && echo "无变化" && exit 0
          git commit -m "scan $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash || true
          git push
