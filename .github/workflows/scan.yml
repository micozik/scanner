name: A股自动扫描

on:
  schedule:
    - cron: '0,30 1-6 * * 1-5'
    - cron: '0 7 * * 1-5'
    - cron: '5 8 * * 1-5'
    - cron: '35 10 * * 1-5'
    - cron: '15 1,5,9,13 * * 6,0'
  workflow_dispatch:

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install akshare pandas

      - name: 运行扫描器
        run: python scanner_cloud.py

      - name: 提交日报到仓库
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -f reports/latest.txt
          git add reports/
          if git diff --cached --quiet; then echo "无改动，跳过"; exit 0; fi
          git commit -m "自动扫描 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "push撞车，重试 $i"; sleep 3
          done
