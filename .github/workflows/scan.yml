name: A股自动扫描

# ★★V22.0 修复 8/18 push rejected★★
# 症状：git rebase 冲突 → "Could not apply ... non-fast-forward" → 三次推送均失败
# 根因：reports/ 里的文件每次跑都变，两个workflow撞上就冲突，rebase卡死
# ★报告文件是【新的覆盖旧的】，不需要保留历史 →
#   改用 reset --soft 到最新远端，把本地改动重新提交一次，
#   永远是 fast-forward，不可能被拒。

permissions:
  contents: write

concurrency:
  group: scan-a
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      check:
        description: '★即时体检★ 填股票名字或代码（多只逗号分隔）留空则不查'
        required: false
        default: ''
  schedule:
    - cron: '25 1 * * 1-5'    # 北京 09:25
    - cron: '25 2 * * 1-5'    # 北京 10:25
    - cron: '25 3 * * 1-5'    # 北京 11:25
    - cron: '0 5 * * 1-5'     # 北京 13:00
    - cron: '0 6 * * 1-5'     # 北京 14:00
    - cron: '55 6 * * 1-5'    # 北京 14:55
    - cron: '30 7 * * 1-5'    # 北京 15:30 盘后
    - cron: '15 1 * * 6,0'
    - cron: '15 5 * * 6,0'
    - cron: '15 9 * * 6,0'
    - cron: '15 13 * * 6,0'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas requests lxml beautifulsoup4
      - name: 运行扫描
        env:
          CHECK: ${{ github.event.inputs.check }}
          HARD_LIMIT: '1020'
        run: python scanner_cloud.py

      - name: 提交报告
        run: |
          git config user.name  "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          if [ -z "$(git status --porcelain reports/)" ]; then
            echo "报告无变化"; exit 0
          fi
          for i in 1 2 3; do
            echo "── 推送尝试 $i/3 ──"
            # ★关键：先把本地改动暂存，指针对齐最新远端，再提交
            #   这样永远是 fast-forward，不会 rejected，也不会有 rebase 冲突
            git stash push -u reports/ || true
            git fetch origin main
            git reset --hard origin/main
            git stash pop || git checkout --theirs . || true
            git add -A reports/
            if [ -z "$(git diff --staged --name-only)" ]; then
              echo "对齐后无差异"; exit 0
            fi
            git commit -m "scan $(date -u '+%Y-%m-%d %H:%M') UTC"
            if git push origin HEAD:main; then
              echo "✅ 推送成功"; exit 0
            fi
            echo "⚠️ 推送失败，8秒后重试"; sleep 8
          done
          echo "🔴 三次推送均失败（报告已生成，下次会补推）"
          exit 0
