name: A股自动扫描

on:
  schedule:
    - cron: '25 1,2,3 * * 1-5'
    - cron: '0 5,6 * * 1-5'
    - cron: '55 6 * * 1-5'
    - cron: '30 7 * * 1-5'
    - cron: '35 10 * * 1-5'
    - cron: '15 1,5,9,13 * * 6,0'
  workflow_dispatch:

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install akshare pandas
      - run: python scanner_cloud.py
      - name: 提交日报
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -f reports/latest.txt
          git add reports/
          if git diff --cached --quiet; then echo "无改动"; exit 0; fi
          git commit -m "自动扫描 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            sleep 3
          done
