name: 历史回测

permissions:
  contents: write

concurrency:
  group: scan-bt
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      hold:
        description: '最长持有天数'
        required: false
        default: '10'

jobs:
  zt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas requests lxml
      - name: 运行
        env:
          HOLD: ${{ github.event.inputs.hold || '10' }}
        run: |
          touch /tmp/run_start
          python backtest.py
      - name: 提交报告（reset+复制，不rebase）
        if: always()
        run: |
          git config user.name  "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          rm -rf /tmp/rp_backup; mkdir -p /tmp/rp_backup
          (cd reports && find . -type f -newer /tmp/run_start -exec cp --parents {} /tmp/rp_backup/ \;)
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports; cp -a /tmp/rp_backup/. reports/
            git add -A -f reports/
            if git diff --staged --quiet; then echo "无差异"; exit 0; fi
            git commit -q -m "bt $(date -u '+%Y-%m-%d %H:%M') UTC run#${{ github.run_number }}"
            if git push origin HEAD:main; then echo "✅ 推送成功"; exit 0; fi
            sleep $((i*5))
          done
          exit 1
