name: 龙虎榜扫描

on:
  schedule:
    - cron: '45 10 * * 1-5'
    - cron: '30 12 * * 1-5'
  workflow_dispatch:

concurrency:
  group: lhb
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lhb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install akshare pandas
      - run: python scanner_lhb.py
      - name: 提交龙虎榜
        run: |
          git config user.name "lhb-bot"
          git config user.email "lhb-bot@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then echo "无改动"; exit 0; fi
          git commit -m "龙虎榜 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            sleep 3
          done
