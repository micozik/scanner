name: 龙虎榜扫描

permissions:
  contents: write

concurrency:
  group: scan-lhb
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: '★历史回溯★ 填天数(如 60)一次性拉过去N个交易日补足样本，留空则不回溯'
        required: false
        default: ''
  schedule:
    - cron: '45 10 * * 1-5'    # 北京 18:45（龙虎榜18:35发布）

jobs:
  lhb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas requests lxml beautifulsoup4
      - name: 应用龙虎榜补丁
        run: |
          for f in patch*lhb*.py; do
            if [ -f "$f" ]; then echo "--- $f ---"; python "$f"; fi
          done
      - name: 运行龙虎榜扫描
        env:
          BACKFILL: ${{ github.event.inputs.backfill }}
        run: |
          touch /tmp/run_start
          python scanner_lhb.py
      - name: 提交报告（reset+复制，不rebase）
        if: always()
        run: |
          git config user.name  "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          rm -rf /tmp/rp_backup; mkdir -p /tmp/rp_backup
          # ★只带走本次新写的报告文件，reset 后原样复制回去：不会rebase冲突、不会覆盖别的工作流刚推的报告
          (cd reports && find . -type f -newer /tmp/run_start -exec cp --parents {} /tmp/rp_backup/ \;)
          echo "本次新写文件：$(find /tmp/rp_backup -type f | wc -l) 个"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports; cp -a /tmp/rp_backup/. reports/
            git add -A -f reports/
            if git diff --staged --quiet; then echo "对齐后无差异"; exit 0; fi
            git commit -q -m "lhb $(date -u '+%Y-%m-%d %H:%M') UTC run#${{ github.run_number }}"
            if git push origin HEAD:main; then echo "✅ 推送成功"; exit 0; fi
            echo "⚠️ 推送失败，重试"; sleep $((i*5))
          done
          exit 1
