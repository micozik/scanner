name: 美股夜盘扫描

# ★2026-10-02 修复：原版没有【应用补丁】这一步，
#   patch12(日期)、patch23(运行号文件)、patch_usa46(持仓对标) 传上去从没执行过，
#   所以 us113/us116/us118/us120 全部 404。
# ★只应用文件名含 usa 的补丁（A股补丁是给 scanner_cloud.py 的，这里不需要）
#   兼容手机上传把下划线变空格：patch23_usa_runnum.py / "patch23 usa runnum.py" 都认

on:
  schedule:
    - cron: '35 20 * * 1-5'
  workflow_dispatch:

concurrency:
  group: scan-usa
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install akshare pandas

      - name: 应用美股补丁
        run: |
          echo "════ 美股补丁清单 ════"
          ls -1 patch*usa*.py 2>/dev/null || echo "（没有美股补丁）"
          echo "════ 开始应用 ════"
          for f in patch*usa*.py; do
            if [ -f "$f" ]; then echo "--- $f ---"; python "$f"; fi
          done
          echo "════ 应用完毕 ════"

      - run: |
          touch /tmp/run_start
          python scanner_usa.py

      - name: 提交美股报告
        if: always()
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          rm -rf /tmp/rp_backup; mkdir -p /tmp/rp_backup
          # ★只带走本次新写的报告文件，reset 后原样复制回去：不会rebase冲突、不会覆盖别的工作流刚推的报告
          (cd reports && find . -type f -newer /tmp/run_start -exec cp --parents {} /tmp/rp_backup/ \;)
          echo "本次新写文件：$(find /tmp/rp_backup -type f | wc -l) 个"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports; cp -a /tmp/rp_backup/. reports/
            git add -A -f reports/
            if git diff --staged --quiet; then echo "对齐后无差异"; exit 0; fi
            git commit -q -m "美股扫描 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') run#${{ github.run_number }}"
            if git push origin HEAD:main; then echo "✅ 推送成功"; exit 0; fi
            echo "⚠️ 推送失败，重试"; sleep $((i*5))
          done
          echo ""
          echo "════════════════════════════════════════════"
          echo "★把下面这条发给AI（每次运行号不同，缓存打不中）："
          echo "https://micozik.github.io/scanner/reports/us${{ github.run_number }}.txt"
          echo "════════════════════════════════════════════"
