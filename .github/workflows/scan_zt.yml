name: 明日涨停猎手

permissions:
  contents: write

concurrency:
  group: scan-zt
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'hunt=收盘后找明日涨停；auction=明早9:26竞价确认'
        required: false
        default: 'hunt'
  schedule:
    - cron: '20 7 * * 1-5'    # 北京 15:20 收盘后
    - cron: '27 1 * * 1-5'    # 北京 09:27 竞价确认

jobs:
  zt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas requests lxml
      - name: 运行
        env:
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '27 1 * * 1-5' && 'auction' || 'hunt') }}
        run: |
          touch /tmp/run_start
          python scanner_zt.py
      - name: 提交报告（reset+复制，不rebase）
        if: always()
        run: |
          git config user.name  "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          rm -rf /tmp/rp_backup; mkdir -p /tmp/rp_backup
          (cd reports && find . -type f -newer /tmp/run_start -exec cp --parents {} /tmp/rp_backup/ \;)
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports; cp -a /tmp/rp_backup/. reports/
            git add -A -f reports/
            if git diff --staged --quiet; then echo "无差异"; exit 0; fi
            git commit -q -m "zt $(date -u '+%Y-%m-%d %H:%M') UTC run#${{ github.run_number }}"
            if git push origin HEAD:main; then echo "✅ 推送成功"; exit 0; fi
            sleep $((i*5))
          done
          exit 1
